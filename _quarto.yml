project:
  type: book
  output-dir: docs
  resources:
    - dados/wage1_core.csv
    - dados/wage1_core.xlsx
    - dados/wage1_core.rds

lang: pt-BR

book:
  title: "Introdução ao R"
  subtitle: "Notas de Aula"
  favicon: figuras/marca/monograma-positivo.svg
  navbar:
    background: "#071739"
    logo: figuras/usp.png
    search: true
    left:
      - text: "Home"
        file: index.qmd
      #- intro.qmd
      #- summary.qmd
      #- pesquisa.qmd
      #- interpretando.qmd
    right:
      - text: '<img class="navbar-marca-autoral" src="data:image/svg+xml;base64," alt="Alexandre Nicolella">'
        file: cap/cap1_autores.qmd
      - icon: github
        href: https://github.com/anicolella
        aria-label: GitHub
  sidebar:
    background: "#F8F5EF"
    search: true
    style: "docked"
    collapse-level: 1
  page-navigation: true
  page-footer:
    center: '<span class="credito-autoral"><img src="data:image/svg+xml;base64," alt=""> <span>Design e Criação: <strong>Alexandre Nicolella</strong></span></span>'
  author:
  - name: "Alexandre Nicolella"
    affiliation: "Universidade de São Paulo (USP)"
  date: "03/13/2026"
  chapters:
    - index.qmd
    - cap/cap2_summary.qmd
    - cap/cap2_1_como_utilizar.qmd
    - cap/cap1_autores.qmd

    - part: "Parte I — Do problema econômico à investigação com dados"
      chapters:
        - cap/cap04_problema_pergunta.qmd
        - cap/cap05_pergunta_dados.qmd
        - cap/cap06_evidencia_conclusao.qmd
        - cap/cap07_planejamento_investigacao.qmd

    - part: "Parte II — Ambiente e fundamentos de R"
      chapters:
        - cap/cap08_ambiente_r.qmd
        - cap/cap09_projetos_reprodutiveis.qmd
        - cap/cap10_objetos_operacoes.qmd
        - cap/cap11_dataframes_importacao.qmd
        - cap/cap12_qualidade_dados.qmd

    - part: "Parte III — Transformação e organização"
      chapters:
        - cap/cap13_tidyverse_pipe.qmd
        - cap/cap14_manipulacao_dplyr.qmd
        - cap/cap15_dados_tidy_tidyr.qmd
        - cap/cap16_combinacao_bases.qmd
        - cap/cap17_textos_datas_categorias.qmd

    - part: "Parte IV — Visualização e descrição"
      chapters:
        - cap/cap18_visualizacao_ggplot2.qmd
        - cap/cap19_estatistica_descritiva.qmd
        - cap/cap20_distribuicoes_relacoes.qmd

    - part: "Parte V — Da descrição à explicação"
      chapters:
        - cap/cap21_modelos_lineares.qmd
        - cap/cap22_binarios_contagens.qmd
        - cap/cap23_dados_painel.qmd

    - part: "Parte VI — Programação e automação"
      chapters:
        - cap/cap24_condicoes_repeticoes.qmd
        - cap/cap25_funcoes_reutilizacao.qmd

    - part: "Parte VII — Tutoriais aplicados"
      chapters:
        - cap/cap26_tutoriais_microeconomia.qmd
        - cap/cap27_tutoriais_macroeconomia.qmd
        - cap/cap28_tutoriais_financas.qmd


    - part: "Recursos complementares"
      chapters:
        - cap/cap5_googledrive.qmd
        - cap/capextra_github.qmd


bibliography: references.bib

execute:
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - tema-moderno.scss
    css: estilos.css
    toc: true
    toc-title: "Neste capítulo"
    fontsize: 16px
    #linestretch: 1.7
  #pdf:
    #documentclass: scrreprt


editor: visual

